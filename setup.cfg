[metadata]
name = besser
version = 8.0.0
author = Luxembourg Institute of Science and Technology
description = BESSER
long_description = file: README.md
long_description_content_type = text/markdown
project_urls =
    Documentation = https://besser.readthedocs.io/en/latest/
    Source Code = https://github.com/BESSER-PEARL/BESSER
    Bug Tracker = https://github.com/BESSER-PEARL/BESSER/issues
keywords = uml, code generation, python
license = MIT
license_files = LICENSE.md

[options]
python_requires = >=3.11
install_requires = file: requirements.txt
packages=find:

[options.package_data]
* = *.j2
# The price table must ship: without it every pip install silently falls back
# to the coarse built-in tiers. Keyed to the parent package with the subdir in
# the pattern, because ``packages=find:`` does not see ``data/`` (no
# __init__.py) and a key naming it would be inert. Not a global ``*.json``,
# which would sweep in every other .json in the tree.
# data/ sits beside llm_client.py in providers/, because that module
# resolves it with Path(__file__).with_name("data"). Key must name the
# package that CONTAINS data/, and that package needs an __init__.py for
# packages=find: to see it at all -- providers/ has one.
besser.spec_driven_agent.providers = data/*.json

[options.extras_require]
nn =
    pillow>=11.1.0
    numpy>=2.2.4
    torch>=2.6.0
agents =
    openai>=1.40.0