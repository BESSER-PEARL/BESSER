name: Deploy WME

# Builds the editor images and pushes them to :latest. The editor host (the
# LIST VM rp-besser-wme, behind LIST's reverse proxy) is only reachable over the
# LIST VPN, so this workflow never logs in to it: watchtower there pulls new
# :latest images every 30 minutes and recreates the containers. The last step
# waits until the public URL serves the new build.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend          # backend + worker images (besser-wme-backend and besser-wme-smartgen)
          - frontend
          - agent            # modeling agent, from BESSER-PEARL/modeling-agent main
          - agent_simulator

permissions:
  contents: read

# Every deploy moves the same :latest tags: one at a time.
concurrency:
  group: deploy-wme
  cancel-in-progress: false

env:
  REGISTRY_HOST: artefacts.list.lu
  REGISTRY: artefacts.list.lu/besser/web_modeling_editor
  EDITOR_URL: https://editor.besser-pearl.org
  TARGET: ${{ inputs.target }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pushes to artefacts.list.lu from GitHub-hosted runners take ~20+ min
    # (run 43038262597 was cancelled at 20 min), the agent image is ~4 GB, and
    # watchtower takes up to 30 min to install what was pushed.
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Watchtower deploys whatever reaches :latest, so this runs before any push.
      - name: Check the frontend build settings
        if: inputs.target == 'all' || inputs.target == 'frontend'
        env:
          POSTHOG_KEY: ${{ vars.FRONTEND_POSTHOG_KEY }}
        run: |
          if [[ -z "$POSTHOG_KEY" ]]; then
            echo "::error::Set the repository variable FRONTEND_POSTHOG_KEY. Nothing was built or pushed."
            exit 1
          fi

      - name: Login to Docker registry
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin

      # Images are pushed as an OCI index and checked against the registry by
      # .github/scripts/publish_image.sh; a plain `docker push` never moved
      # :latest on artefacts.list.lu (run 43050874178).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Push order matters: the images without a public build stamp (agent,
      # agent simulator, worker) go before the backend, so a watchtower pass
      # that installed the new backend also saw them.
      - name: Checkout modeling agent
        if: inputs.target == 'all' || inputs.target == 'agent'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BESSER-PEARL/modeling-agent
          ref: main
          path: modeling-agent

      - name: Build and push modeling agent image
        if: inputs.target == 'all' || inputs.target == 'agent'
        run: |
          .github/scripts/publish_image.sh "$REGISTRY/modeling_agent:latest" \
            -f modeling-agent/Dockerfile modeling-agent

      # Built from the repository root so it ships this checkout's `besser`.
      - name: Build and push agent simulator image
        if: inputs.target == 'all' || inputs.target == 'agent_simulator'
        run: |
          .github/scripts/publish_image.sh "$REGISTRY/agent_simulator:latest" \
            -f besser/utilities/web_modeling_editor/agent_simulator/Dockerfile .

      # Two targets of one Dockerfile: the worker adds the toolchains and
      # bubblewrap to the backend's dependency layers.
      - name: Build and push worker and backend images
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: |
          .github/scripts/publish_image.sh "$REGISTRY/smartgen_worker:latest" \
            --target smartgen-worker --build-arg GIT_SHA="$GITHUB_SHA" -f Dockerfile .
          .github/scripts/publish_image.sh "$REGISTRY/backend:latest" \
            --target backend --build-arg GIT_SHA="$GITHUB_SHA" -f Dockerfile .

      # The URLs and the PostHog key are baked into the bundle at build time;
      # the Dockerfile defaults point the assistant at ws://localhost:8765.
      - name: Build and push frontend image
        if: inputs.target == 'all' || inputs.target == 'frontend'
        env:
          POSTHOG_KEY: ${{ vars.FRONTEND_POSTHOG_KEY }}
        run: |
          .github/scripts/publish_image.sh "$REGISTRY/frontend:latest" \
            --build-arg DEPLOYMENT_URL="$EDITOR_URL" \
            --build-arg BACKEND_URL="$EDITOR_URL/besser_api" \
            --build-arg UML_BOT_WS_URL=wss://editor.besser-pearl.org/agent \
            --build-arg POSTHOG_HOST=https://eu.i.posthog.com \
            --build-arg POSTHOG_KEY="$POSTHOG_KEY" \
            -f besser/utilities/web_modeling_editor/frontend/Dockerfile \
            besser/utilities/web_modeling_editor/frontend/

      # The entry bundle name is a content hash, so it identifies this build.
      - name: Read the frontend entry bundle
        if: inputs.target == 'all' || inputs.target == 'frontend'
        run: |
          IMAGE="$REGISTRY/frontend:latest"
          docker pull -q "$IMAGE"
          ENTRY=$(docker run --rm --entrypoint cat "$IMAGE" /opt/besser/build/webapp/index.html \
            | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          [[ -n "$ENTRY" ]] || { echo "::error::No entry bundle in the image's index.html"; exit 1; }
          echo "FRONTEND_ENTRY=$ENTRY" >> "$GITHUB_ENV"

      - name: Wait until the editor serves this build
        run: .github/scripts/wait_for_live.sh
