[metadata]
name = besser
version = 8.9.3
author = Luxembourg Institute of Science and Technology
description = BESSER
long_description = file: README.md
long_description_content_type = text/markdown
project_urls =
    Documentation = https://besser.readthedocs.io/en/latest/
    Source Code = https://github.com/BESSER-PEARL/BESSER
    Bug Tracker = https://github.com/BESSER-PEARL/BESSER/issues
keywords = uml, code generation, python
license = MIT
license_files = LICENSE.md

[options]
python_requires = >=3.11
install_requires = file: requirements.txt
packages=find:

[options.packages.find]
; Ship only the library: the test suite is a top-level package (it has an
; __init__.py) and would otherwise land in site-packages as ``tests``.
include = besser, besser.*

[options.package_data]
# Templates live in non-package folders (templates/, templates/src/...), so a bare
# "*.j2" only ships the top level: nested .j2 files and the static files the React
# generator copies (.tsx, .ts, .css, .png) were missing from the wheel. The
# mockup_to_structural refactoring step keeps its template in a singular
# template/ folder. "**" in package_data needs setuptools 62.3+ (pyproject.toml).
* = *.j2, template/*.j2, templates/**/*, templates/**/.*
# The price table and model catalog must ship: without them every pip install
# silently falls back to the coarse built-in tiers. Keyed to the parent package
# with the subdir in the pattern, because ``packages=find:`` does not see
# ``data/`` (no __init__.py) and a key naming it would be inert. Not a global
# ``*.json``, which would sweep in every other .json in the tree.
# data/ sits beside pricing.py and catalog.py in besser/llm, which resolve it
# with Path(__file__).with_name("data").
besser.llm = data/*.json
; Static (non-templated) files shipped with a generator, e.g. the Maven wrapper
; the Spring generator copies into the projects it generates.
besser.generators.spring = resources/*
; Web Modeling Editor backend: requirements.txt is shipped so
; `besser-wme-backend` can point a PyPI user at the exact file to
; `pip install -r` when the backend dependencies are missing; the JSON files
; are read at runtime relative to the backend's own modules.
besser.utilities.web_modeling_editor.backend = requirements.txt
besser.utilities.web_modeling_editor.backend.constants = *.json
; The secret scrub's vendored gitleaks rules; without them it fails at import.
besser.utilities = data/*.toml

[options.entry_points]
; `besser` is the command-line interface (new, validate, info, generators,
; generate, regenerate, convert); the editor backend keeps its own, narrowly
; named, command.
console_scripts =
    besser = besser.cli.main:main
    besser-wme-backend = besser.utilities.web_modeling_editor.backend.cli:main

[options.extras_require]
nn =
    pillow>=11.1.0
    numpy>=2.2.4
    torch>=2.6.0
; tiktoken gives the Spec-Driven Agent accurate token counts for context
; compaction; without it compaction.py estimates len(text)//4, which
; over-reports code by ~21% and compacts early. Pygments separates code from
; comments and strings in the citation and import checks. pygit2 merges the
; generated files a modify run regenerates into the edited ones; pinned, as a
; release bundles a new libgit2, whose merge can resolve hunks differently.
agents =
    openai>=1.40.0
    anthropic>=0.88.0,<1
    tiktoken>=0.7,<1
    pygments>=2.17,<3
    pygit2==1.20.1
kg =
    pyshacl>=0.25.0
; The B-OCL interpreter, to evaluate OCL constraints on object models.
ocl =
    bocl==1.0.4
; generator.regenerate() merges a model change into edited output; pinned, as a
; release bundles a new libgit2, whose merge can resolve hunks differently.
; pygit2 is GPLv2 with a linking exception.
regen =
    pygit2==1.20.1
; DjangoGenerator runs `python -m django startproject`.
django =
    Django>=5.1.5
; BackendGenerator(docker_image=True) builds and pushes the image.
docker =
    docker>=7.1.0
; Database drivers for running generated SQLAlchemy/Django apps against
; PostgreSQL, MySQL, Oracle or SQL Server. BESSER itself imports none of them.
db =
    oracledb>=3.4.1
    psycopg2-binary>=2.9.10
    pymysql>=1.1.1
    pyodbc>=5.2.0
; pytest-xdist runs the suite in parallel (CI: pytest -n auto).
dev =
    pytest>=7.4.0
    pytest-xdist>=3.5,<4
; Every optional part except the contributor tools in dev.
all =
    besser[nn,agents,kg,ocl,regen,django,docker,db]
