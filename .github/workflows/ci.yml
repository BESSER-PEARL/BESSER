name: CI

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      # run_command confines model-authored shell to its own run directory
      # with bubblewrap. Without the package the sandbox tests skip and the
      # shell tests fall back to unconfined, so CI would not exercise the
      # path production actually takes.
      - name: Install bubblewrap (shell sandbox)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # The nn extra (torch, numpy) lets the tests that run generated PyTorch
      # code (the forecaster, the backend's NN methods) run instead of skip.
      # Torch comes first from the CPU-only index: the default wheel pulls in
      # CUDA, several GB that CI never uses.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[nn,dev]"
          pip install -r besser/utilities/web_modeling_editor/backend/requirements.txt
      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Lint
        # Rules live in pyproject.toml ([tool.ruff]), so a local `ruff check` matches CI.
        run: ruff check besser/

  package:
    # What users install: build the wheel, install it outside the checkout and
    # check that the package data (templates, data files) ships with it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/
      - name: Install it and check the package data
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install "$(ls $GITHUB_WORKSPACE/dist/*.whl)"
          wheel-env/bin/python - <<'EOF'
          from importlib import import_module
          from importlib.resources import files
          import pkgutil
          import besser
          import besser.generators
          # Every generator imports on the base install; extras load lazily.
          for module in pkgutil.iter_modules(besser.generators.__path__):
              import_module(f"besser.generators.{module.name}")
          root = files("besser")
          for path in (
              "spec_driven_agent/providers/data/model_catalog.json",
              "spec_driven_agent/providers/data/model_prices.json",
              "generators/spring/resources/mvnw",
          ):
              assert root.joinpath(path).is_file(), f"missing from the wheel: {path}"
          templates = list(root.joinpath("generators/django/templates").iterdir())
          assert templates, "generator templates missing from the wheel"
          print("wheel OK:", besser.__file__)
          EOF

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install docs dependencies (mirrors the Read the Docs build)
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -r requirements.txt
      - name: Build docs and gate on new warnings
        run: python docs/check_docs.py
