# BESSER Lab: two kinds of origin, so model-written code never runs where the lab's session lives.
#
#   https://lab.example.org            the lab: its own built editor (127.0.0.1:8080) and its backend (127.0.0.1:9000)
#   https://<preview host of slot i>   one change's preview: its backend, editor dev server and modeling agent,
#                                      on ports 9100+10i, 8180+10i, 8865+10i (services/lab/preview.py); never 9000
#
# provision.sh renders this template into /etc/nginx/conf.d/besser-lab.conf (render_nginx_conf): lab.example.org
# becomes LAB_HOST, each "# LAB_ALLOW_CIDRS" line one `allow` line per network, and the block between
# "# BEGIN PREVIEW SLOT" and "# END PREVIEW SLOT" is repeated for each host of BESSER_LAB_PREVIEW_URLS, in order,
# with the slot's host and ports; the port-80 block lists every preview host. One certificate holds every name.

map $http_upgrade $besser_lab_connection {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name lab.example.org __PREVIEW_HOSTS__;
    server_tokens off;

    # Certificate issue and renewal (certbot --webroot): Let's Encrypt is not in LAB_ALLOW_CIDRS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The redirect goes through try_files: a `return` here would answer before allow/deny is checked.
    location / {
        allow 192.0.2.0/24;  # LAB_ALLOW_CIDRS
        deny all;
        try_files /nonexistent @https;
    }

    location @https {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lab.example.org;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/lab.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:BESSER_LAB_TLS:10m;
    ssl_session_timeout 1d;

    # Only these networks reach the lab and its previews.
    allow 192.0.2.0/24;  # LAB_ALLOW_CIDRS
    deny all;

    client_max_body_size 50m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Inherited by every location below that sets no proxy header of its own.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # All of the API goes to the lab backend. A lab run streams as SSE for up to BESSER_LAB_MAX_RUNTIME_SECONDS
    # (2400 s) plus the checks: nothing buffers or compresses it, and the cost events every few seconds keep the
    # read timeout from firing between tool calls. Simulation also opens a WebSocket here.
    location /besser_api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $besser_lab_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The lab's own editor (LAB_BUILD=true), built from the lab's checkout and served by the editor's Express
    # server (besser-lab-editor.service) with the production CSP. Its frame header is replaced by DENY above.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_read_timeout 60s;
    }
}

# BEGIN PREVIEW SLOT
server {
    listen 443 ssl http2;
    server_name __PREVIEW_HOST__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/lab.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:BESSER_LAB_TLS:10m;
    ssl_session_timeout 1d;

    # The preview runs a change's unreviewed code, and its backend and modeling agent have no sign-in.
    allow 192.0.2.0/24;  # LAB_ALLOW_CIDRS
    deny all;

    client_max_body_size 50m;
    client_body_timeout 30s;

    # Only the lab may frame the preview (its Try it tab); no X-Frame-Options, which would forbid that.
    add_header Content-Security-Policy "frame-ancestors https://lab.example.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # The change's backend. Its Spec-Driven runs stream as SSE like the lab's.
    location /besser_api/ {
        proxy_pass http://127.0.0.1:__PREVIEW_BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $besser_lab_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The change's modeling agent (WebSocket). Upstream path is "/", query string kept (?user_id=...).
    location = /agent {
        proxy_pass http://127.0.0.1:__PREVIEW_AGENT_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /agent/ {
        proxy_pass http://127.0.0.1:__PREVIEW_AGENT_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The change's editor: Vite's dev server, whose hot-reload client opens a WebSocket on this same origin.
    # Host is rewritten to one Vite accepts; this block already restricts who gets here.
    location / {
        proxy_pass http://127.0.0.1:__PREVIEW_FRONTEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $besser_lab_connection;
        proxy_set_header Host              localhost;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
# END PREVIEW SLOT
