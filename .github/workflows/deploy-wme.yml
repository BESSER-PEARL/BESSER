name: Deploy WME to EC2

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend          # restarts besser-wme-backend and besser-wme-smartgen
          - frontend
          - agent_simulator

env:
  REGISTRY: artefacts.list.lu/besser/web_modeling_editor
  SSH_TARGET: ec2-user@ec2-16-16-223-38.eu-north-1.compute.amazonaws.com
  EDITOR_URL: https://editor.besser-pearl.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Record the commit being deployed
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker registry
        run: echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login artefacts.list.lu -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

      # ── Backend (also the besser-wme-smartgen worker's image) ─
      - name: Build backend image
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: |
          docker build --build-arg GIT_SHA=${{ steps.src.outputs.sha }} \
            -t ${{ env.REGISTRY }}/backend:latest -f Dockerfile .

      - name: Push backend image
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: docker push ${{ env.REGISTRY }}/backend:latest

      # ── Frontend ─────────────────────────────────────────────
      - name: Build frontend image
        if: inputs.target == 'all' || inputs.target == 'frontend'
        run: |
          docker build -t ${{ env.REGISTRY }}/frontend:latest \
            -f besser/utilities/web_modeling_editor/frontend/Dockerfile \
            besser/utilities/web_modeling_editor/frontend/

      - name: Push frontend image
        if: inputs.target == 'all' || inputs.target == 'frontend'
        run: docker push ${{ env.REGISTRY }}/frontend:latest

      # ── Agent simulator ──────────────────────────────────────
      # Built from the repository root so it ships this checkout's `besser`.
      - name: Build agent simulator image
        if: inputs.target == 'all' || inputs.target == 'agent_simulator'
        run: |
          docker build -t ${{ env.REGISTRY }}/agent_simulator:latest \
            -f besser/utilities/web_modeling_editor/agent_simulator/Dockerfile .

      - name: Push agent simulator image
        if: inputs.target == 'all' || inputs.target == 'agent_simulator'
        run: docker push ${{ env.REGISTRY }}/agent_simulator:latest

      # ── Deploy to EC2 ───────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ec2-16-16-223-38.eu-north-1.compute.amazonaws.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy on EC2
        run: |
          SERVICES=""
          if [[ "${{ inputs.target }}" == "all" || "${{ inputs.target }}" == "backend" ]]; then
            # The spec-driven worker runs the backend image, so it is recreated
            # with it; otherwise it keeps running the previous code.
            SERVICES="$SERVICES besser-wme-backend besser-wme-smartgen"
          fi
          if [[ "${{ inputs.target }}" == "all" || "${{ inputs.target }}" == "frontend" ]]; then
            SERVICES="$SERVICES besser-wme-frontend"
          fi
          if [[ "${{ inputs.target }}" == "all" || "${{ inputs.target }}" == "agent_simulator" ]]; then
            SERVICES="$SERVICES besser-wme-agent-simulator"
          fi

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.SSH_TARGET }} << EOF
            set -e
            echo "Pulling latest images..."
            docker compose pull $SERVICES
            echo "Restarting services..."
            docker compose up -d $SERVICES
            echo "Pruning dangling images..."
            docker image prune -f
            echo "Running containers:"
            docker compose ps
          EOF

      # `docker compose pull` succeeds on a stale tag too, so compare the
      # commit stamped into the image (BESSER_BUILD_SHA) with the one built.
      - name: Verify the running containers are the code just built
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: |
          EXPECTED="${{ steps.src.outputs.sha }}"
          FAILED=0
          for C in besser-wme-backend besser-wme-smartgen; do
            RUNNING=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ env.SSH_TARGET }} \
              "docker exec $C printenv BESSER_BUILD_SHA 2>/dev/null || echo missing")
            echo "$C: running=$RUNNING expected=$EXPECTED"
            if [[ "$RUNNING" != "$EXPECTED" ]]; then
              echo "::error::$C is running '$RUNNING', not the commit just built (stale image?)."
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ env.EDITOR_URL }}/besser_api/" || true)
            [[ "$CODE" == "200" ]] && echo "API healthy" && exit 0
            echo "attempt $i: $CODE"; sleep 5
          done
          echo "::error::API did not return 200 after the deploy"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
