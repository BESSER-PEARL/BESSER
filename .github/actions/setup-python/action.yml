name: Set up Python
description: Install Python and an up-to-date pip, with a pip cache when the job names its requirement files.
inputs:
  python-version:
    description: Python version to install.
    default: '3.12'
  cache-dependency-path:
    description: >-
      Files whose hash keys the pip cache; leave empty for no cache. The key has
      no job in it, so jobs installing different things must pass different files.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache-dependency-path && 'pip' || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - run: python -m pip install --upgrade pip
      shell: bash
