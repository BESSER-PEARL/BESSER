name: Deploy WME to EC2

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend          # backend + worker images; restarts besser-wme-backend and besser-wme-smartgen
          - frontend
          - agent_simulator

env:
  REGISTRY: artefacts.list.lu/besser/web_modeling_editor
  SSH_TARGET: ec2-user@ec2-16-16-223-38.eu-north-1.compute.amazonaws.com
  EDITOR_URL: https://editor.besser-pearl.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Record the commit being deployed
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ec2-16-16-223-38.eu-north-1.compute.amazonaws.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Resolve the services to deploy
        id: svc
        run: |
          SERVICES=""
          if [[ "${{ inputs.target }}" == "all" || "${{ inputs.target }}" == "backend" ]]; then
            # The spec-driven worker is built from the same commit, so it is
            # recreated with the backend; otherwise it keeps the previous code.
            SERVICES="$SERVICES besser-wme-backend besser-wme-smartgen"
          fi
          if [[ "${{ inputs.target }}" == "all" || "${{ inputs.target }}" == "frontend" ]]; then
            SERVICES="$SERVICES besser-wme-frontend"
          fi
          if [[ "${{ inputs.target }}" == "all" || "${{ inputs.target }}" == "agent_simulator" ]]; then
            SERVICES="$SERVICES besser-wme-agent-simulator"
          fi
          echo "list=$SERVICES" >> "$GITHUB_OUTPUT"

      # Before anything is built or pushed: a service missing from the host's
      # compose file would fail `docker compose pull` halfway through, and a
      # worker still on the backend image would lose its toolchains and
      # bubblewrap without any error. Stop here instead, with nothing changed.
      - name: Check the host compose file defines the services
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.SSH_TARGET }}"
          RUNBOOK="docs/source/spec_driven_agent/production_deployment.rst"
          if ! DEFINED=$($SSH "docker compose config --services"); then
            echo "::error::Could not read the host's compose file (docker compose config failed). Nothing was built, pushed or restarted."
            exit 1
          fi
          MISSING=""
          for S in ${{ steps.svc.outputs.list }}; do
            grep -qx "$S" <<< "$DEFINED" || MISSING="$MISSING $S"
          done
          if [[ -n "$MISSING" ]]; then
            echo "::error::The host's compose file does not define:$MISSING. Add them first (besser-wme-smartgen: copy it from docker-compose.prod.yml, see $RUNBOOK). Nothing was built, pushed or restarted."
            exit 1
          fi
          if [[ " ${{ steps.svc.outputs.list }} " == *" besser-wme-smartgen "* ]]; then
            WANT="${{ env.REGISTRY }}/smartgen_worker:latest"
            IMAGE=$($SSH "docker compose config --images besser-wme-smartgen") \
              || IMAGE="unknown (docker compose config --images failed)"
            if [[ "$IMAGE" != "$WANT" ]]; then
              echo "::error::besser-wme-smartgen uses '$IMAGE' on the host, not '$WANT'. The backend image no longer carries the worker's toolchains or bubblewrap; point the service at $WANT (see $RUNBOOK). Nothing was built, pushed or restarted."
              exit 1
            fi
          fi
          echo "The host defines:${{ steps.svc.outputs.list }}"

      - name: Login to Docker registry
        run: echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login artefacts.list.lu -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

      # ── Backend and the besser-wme-smartgen worker ──────────
      # Two targets of one Dockerfile: the worker adds the toolchains and
      # bubblewrap to the backend's dependency layers.
      - name: Build backend and worker images
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: |
          docker build --target backend --build-arg GIT_SHA=${{ steps.src.outputs.sha }} \
            -t ${{ env.REGISTRY }}/backend:latest -f Dockerfile .
          docker build --target smartgen-worker --build-arg GIT_SHA=${{ steps.src.outputs.sha }} \
            -t ${{ env.REGISTRY }}/smartgen_worker:latest -f Dockerfile .

      - name: Push backend and worker images
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: |
          docker push ${{ env.REGISTRY }}/backend:latest
          docker push ${{ env.REGISTRY }}/smartgen_worker:latest

      # ── Frontend ─────────────────────────────────────────────
      - name: Build frontend image
        if: inputs.target == 'all' || inputs.target == 'frontend'
        run: |
          docker build -t ${{ env.REGISTRY }}/frontend:latest \
            -f besser/utilities/web_modeling_editor/frontend/Dockerfile \
            besser/utilities/web_modeling_editor/frontend/

      - name: Push frontend image
        if: inputs.target == 'all' || inputs.target == 'frontend'
        run: docker push ${{ env.REGISTRY }}/frontend:latest

      # ── Agent simulator ──────────────────────────────────────
      # Built from the repository root so it ships this checkout's `besser`.
      - name: Build agent simulator image
        if: inputs.target == 'all' || inputs.target == 'agent_simulator'
        run: |
          docker build -t ${{ env.REGISTRY }}/agent_simulator:latest \
            -f besser/utilities/web_modeling_editor/agent_simulator/Dockerfile .

      - name: Push agent simulator image
        if: inputs.target == 'all' || inputs.target == 'agent_simulator'
        run: docker push ${{ env.REGISTRY }}/agent_simulator:latest

      # ── Deploy to EC2 ───────────────────────────────────────
      - name: Deploy on EC2
        run: |
          SERVICES="${{ steps.svc.outputs.list }}"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.SSH_TARGET }} << EOF
            set -e
            echo "Pulling latest images..."
            docker compose pull $SERVICES
            echo "Restarting services..."
            docker compose up -d $SERVICES
            echo "Pruning dangling images..."
            docker image prune -f
            echo "Running containers:"
            docker compose ps
          EOF

      # `docker compose pull` succeeds on a stale tag too, so compare the
      # commit stamped into the image (BESSER_BUILD_SHA) with the one built.
      - name: Verify the running containers are the code just built
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: |
          EXPECTED="${{ steps.src.outputs.sha }}"
          FAILED=0
          # By service, not container name: docker-compose.prod.yml pins no
          # container_name for the backend.
          for C in besser-wme-backend besser-wme-smartgen; do
            RUNNING=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ env.SSH_TARGET }} \
              "docker compose exec -T $C printenv BESSER_BUILD_SHA 2>/dev/null || echo missing")
            echo "$C: running=$RUNNING expected=$EXPECTED"
            if [[ "$RUNNING" != "$EXPECTED" ]]; then
              echo "::error::$C is running '$RUNNING', not the commit just built (stale image?)."
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ env.EDITOR_URL }}/besser_api/" || true)
            [[ "$CODE" == "200" ]] && echo "API healthy" && exit 0
            echo "attempt $i: $CODE"; sleep 5
          done
          echo "::error::API did not return 200 after the deploy"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
