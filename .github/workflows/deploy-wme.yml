name: Deploy WME to EC2

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend          # backend + worker images; restarts besser-wme-backend and besser-wme-smartgen
          - frontend
          - agent_simulator

permissions:
  contents: read

# Every deploy moves the same :latest tags and restarts the same host: one at a time.
concurrency:
  group: deploy-wme
  cancel-in-progress: false

env:
  REGISTRY_HOST: artefacts.list.lu
  REGISTRY: artefacts.list.lu/besser/web_modeling_editor
  SSH_USER: ec2-user
  SSH_HOST: ec2-16-16-223-38.eu-north-1.compute.amazonaws.com
  EDITOR_URL: https://editor.besser-pearl.org
  TARGET: ${{ inputs.target }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pushing images to artefacts.list.lu from GitHub-hosted runners takes ~20+ min (run 43038262597 was cancelled at 20 min).
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Later steps reach the host as `ssh wme`.
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host wme
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF

      - name: Resolve the services to deploy
        run: |
          # The spec-driven worker is built from the same commit, so it is
          # recreated with the backend; otherwise it keeps the previous code.
          BACKEND="besser-wme-backend besser-wme-smartgen"
          case "$TARGET" in
            all)             SERVICES="$BACKEND besser-wme-frontend besser-wme-agent-simulator" ;;
            backend)         SERVICES="$BACKEND" ;;
            frontend)        SERVICES="besser-wme-frontend" ;;
            agent_simulator) SERVICES="besser-wme-agent-simulator" ;;
            *) echo "::error::Unknown target '$TARGET'"; exit 1 ;;
          esac
          echo "SERVICES=$SERVICES" >> "$GITHUB_ENV"

      - name: Check the host compose file defines the services
        run: .github/scripts/check_host_compose.sh

      # Watchtower deploys whatever reaches :latest, so this runs before any push.
      - name: Check the frontend build settings
        if: inputs.target == 'all' || inputs.target == 'frontend'
        env:
          POSTHOG_KEY: ${{ vars.FRONTEND_POSTHOG_KEY }}
        run: |
          if [[ -z "$POSTHOG_KEY" ]]; then
            echo "::error::Set the repository variable FRONTEND_POSTHOG_KEY. Nothing was built, pushed or restarted."
            exit 1
          fi

      - name: Login to Docker registry
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin

      # Images are pushed as an OCI index and checked against the registry by
      # .github/scripts/publish_image.sh; a plain `docker push` never moved
      # :latest on artefacts.list.lu (run 43050874178).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Two targets of one Dockerfile: the worker adds the toolchains and
      # bubblewrap to the backend's dependency layers.
      - name: Build and push backend and worker images
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: |
          .github/scripts/publish_image.sh "$REGISTRY/backend:latest" \
            --target backend --build-arg GIT_SHA="$GITHUB_SHA" -f Dockerfile .
          .github/scripts/publish_image.sh "$REGISTRY/smartgen_worker:latest" \
            --target smartgen-worker --build-arg GIT_SHA="$GITHUB_SHA" -f Dockerfile .

      # The URLs and the PostHog key are baked into the bundle at build time;
      # the Dockerfile defaults point the assistant at ws://localhost:8765.
      - name: Build and push frontend image
        if: inputs.target == 'all' || inputs.target == 'frontend'
        env:
          POSTHOG_KEY: ${{ vars.FRONTEND_POSTHOG_KEY }}
        run: |
          .github/scripts/publish_image.sh "$REGISTRY/frontend:latest" \
            --build-arg DEPLOYMENT_URL="$EDITOR_URL" \
            --build-arg BACKEND_URL="$EDITOR_URL/besser_api" \
            --build-arg UML_BOT_WS_URL=wss://editor.besser-pearl.org/agent \
            --build-arg POSTHOG_HOST=https://eu.i.posthog.com \
            --build-arg POSTHOG_KEY="$POSTHOG_KEY" \
            -f besser/utilities/web_modeling_editor/frontend/Dockerfile \
            besser/utilities/web_modeling_editor/frontend/

      # Built from the repository root so it ships this checkout's `besser`.
      - name: Build and push agent simulator image
        if: inputs.target == 'all' || inputs.target == 'agent_simulator'
        run: |
          .github/scripts/publish_image.sh "$REGISTRY/agent_simulator:latest" \
            -f besser/utilities/web_modeling_editor/agent_simulator/Dockerfile .

      - name: Deploy on EC2
        run: |
          # $SERVICES expands here, on the runner.
          # shellcheck disable=SC2087
          ssh wme << EOF
            set -e
            echo "Pulling latest images..."
            docker compose pull $SERVICES
            echo "Restarting services..."
            docker compose up -d $SERVICES
            echo "Pruning dangling images..."
            docker image prune -f
            echo "Running containers:"
            docker compose ps
          EOF

      # `docker compose pull` succeeds on a stale tag too, so compare the
      # commit stamped into the image (BESSER_BUILD_SHA) with the one built.
      - name: Verify the running containers are the code just built
        if: inputs.target == 'all' || inputs.target == 'backend'
        run: |
          FAILED=0
          # By service, not container name: docker-compose.prod.yml pins no
          # container_name for the backend.
          for C in besser-wme-backend besser-wme-smartgen; do
            # shellcheck disable=SC2029  # $C expands here, on the runner
            RUNNING=$(ssh wme "docker compose exec -T $C printenv BESSER_BUILD_SHA 2>/dev/null || echo missing")
            echo "$C: running=$RUNNING expected=$GITHUB_SHA"
            if [[ "$RUNNING" != "$GITHUB_SHA" ]]; then
              echo "::error::$C is running '$RUNNING', not the commit just built (stale image?)."
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$EDITOR_URL/besser_api/" || true)
            [[ "$CODE" == "200" ]] && echo "API healthy" && exit 0
            echo "attempt $i: $CODE"; sleep 5
          done
          echo "::error::API did not return 200 after the deploy"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
