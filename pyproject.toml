[build-system]
requires = ["setuptools>=62.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Use importlib mode to avoid namespace collisions between test and source packages
# that share the same directory hierarchy (e.g., tests/utilities/... vs besser/utilities/...)
addopts = "--import-mode=importlib"
# A bare `pytest` collects only the suite, not examples/ or docs/.
testpaths = ["tests"]
markers = [
    "slow: tests that take noticeably long (subprocess or large-ontology runs); deselect with -m 'not slow'",
]

[tool.pylint.'FORMAT']
max-line-length = 120

[tool.ruff]
extend-exclude = ["*/BESSERActionLanguageParser.py"]

[tool.ruff.lint]
# F821 catches undefined names that `from __future__ import annotations`
# hides from every other rule here.
select = ["F841", "F401", "F541", "F811", "F821", "E711", "E721", "E731", "E741"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Few-shot prompt snippets, not importable modules.
"besser/BUML/notations/mockup_to_buml/llm_assistant/**" = ["F821"]

[tool.importlinter]
root_package = "besser"

[[tool.importlinter.contracts]]
name = "BESSER layers: a layer imports only the layers below it"
type = "layers"
layers = [
    "besser.utilities.web_modeling_editor",
    "besser.spec_driven_agent",
    "besser.generators",
    "besser.BUML.notations",
    "besser.BUML.metamodel",
]
# Known exceptions, each to be removed by the change named next to it.
ignore_imports = [
    # The JSON converters live in the editor backend until they move out of
    # it (review B10).
    "besser.generators.agents.baf_generator -> besser.utilities.web_modeling_editor.backend.services.converters",
    "besser.spec_driven_agent.pipeline.modify_run -> besser.utilities.web_modeling_editor.backend.services.converters.buml_to_json.class_diagram_converter",
    # The mockup refactoring steps are LLM generators filed under notations.
    "besser.BUML.notations.mockup_to_buml.refactoring_model.* -> besser.generators",
    "besser.BUML.notations.mockup_to_structural.refactoring_model.* -> besser.generators",
]

[[tool.importlinter.contracts]]
name = "The LLM layer imports no caller of it"
type = "forbidden"
# besser.llm sits below everything that calls an LLM, the notations included.
# This forbids the utilities that call an LLM; of the others it uses
# secret_redaction (and, through it, workspace_fs).
source_modules = ["besser.llm"]
forbidden_modules = [
    "besser.BUML",
    "besser.generators",
    "besser.spec_driven_agent",
    "besser.utilities.image_to_buml",
    "besser.utilities.kg_llm_to_buml",
    "besser.utilities.llm_utils",
    "besser.utilities.web_modeling_editor",
]

[[tool.importlinter.contracts]]
name = "Editor backend services do not import its routers"
type = "forbidden"
# Routers call services and map their results to HTTP, never the other way round.
source_modules = ["besser.utilities.web_modeling_editor.backend.services"]
forbidden_modules = ["besser.utilities.web_modeling_editor.backend.routers"]

[[tool.importlinter.contracts]]
name = "Utilities do not import the generators, the agent or the editor backend"
type = "forbidden"
source_modules = [
    "besser.utilities.buml_code_builder",
    "besser.utilities.identifiers",
    "besser.utilities.image_to_buml",
    "besser.utilities.kg_llm_to_buml",
    "besser.utilities.kg_to_buml",
    "besser.utilities.llm_utils",
    "besser.utilities.path_utils",
    "besser.utilities.provenance",
    "besser.utilities.sdmx_to_buml",
    "besser.utilities.secret_redaction",
    "besser.utilities.subprocess_env",
    "besser.utilities.three_way_merge",
    "besser.utilities.utils",
    "besser.utilities.workspace_fs",
]
forbidden_modules = [
    "besser.generators",
    "besser.spec_driven_agent",
    "besser.utilities.web_modeling_editor",
]
ignore_imports = [
    # Optional (guarded) reference User Modeling Language model, kept with the
    # editor backend until the converters move out of it (review B10).
    "besser.utilities.buml_code_builder.project_builder -> besser.utilities.web_modeling_editor.backend.constants.user_buml_model",
]
