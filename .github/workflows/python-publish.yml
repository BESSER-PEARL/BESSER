# Builds the sdist and wheel and uploads them to PyPI when a release is published.
name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No pip cache: a release build must not start from a cache other runs wrote.
      - uses: ./.github/actions/setup-python
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
