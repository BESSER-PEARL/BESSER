name: CI

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      # run_command confines model-authored shell to its own run directory
      # with bubblewrap. Without the package the sandbox tests skip and the
      # shell tests fall back to unconfined, so CI would not exercise the
      # path production actually takes.
      - name: Install bubblewrap (shell sandbox)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # zsh and fish check the syntax of the 'besser completion' scripts; without them those tests skip.
      - name: Install zsh and fish (completion scripts)
        run: sudo apt-get install -y zsh fish
      # The nn extra (torch, numpy) lets the tests that run generated PyTorch
      # code (the forecaster, the backend's NN methods) run instead of skip.
      # Torch comes first from the CPU-only index: the default wheel pulls in
      # CUDA, several GB that CI never uses.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[nn,dev,mcp]"
          pip install -r besser/utilities/web_modeling_editor/backend/requirements.txt
      # pytest-xdist (dev extra): one worker per core.
      - name: Run tests
        run: |
          python -m pytest tests/ -n auto -q --tb=short

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff import-linter==2.15
      - name: Lint
        # Rules live in pyproject.toml ([tool.ruff]), so a local `ruff check` matches CI.
        run: ruff check besser/
      - name: Import layers
        # Contracts in pyproject.toml ([tool.importlinter]).
        run: lint-imports

  openapi:
    # The editor's typed API client is generated from the backend's OpenAPI
    # schema committed in the frontend submodule; fail when it is stale. Its
    # own job: checking the submodule out in `tests` would also run the tests
    # that read editor templates from it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r besser/utilities/web_modeling_editor/backend/requirements.txt
      - name: Compare the editor's OpenAPI schema with the backend's
        run: python .github/scripts/check_openapi.py

  package:
    # What users install: build the wheel, install it outside the checkout and
    # check that the package data (templates, data files) ships with it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/
      - name: Install it and check the package data
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install "$(ls $GITHUB_WORKSPACE/dist/*.whl)"
          wheel-env/bin/python - <<'EOF'
          from importlib import import_module
          from importlib.resources import files
          import pkgutil
          import besser
          import besser.generators
          # Every generator imports on the base install; extras load lazily.
          for module in pkgutil.iter_modules(besser.generators.__path__):
              import_module(f"besser.generators.{module.name}")
          root = files("besser")
          for path in (
              "llm/data/model_catalog.json",
              "llm/data/model_prices.json",
              "generators/spring/resources/mvnw",
              "utilities/data/gitleaks_rules.toml",
          ):
              assert root.joinpath(path).is_file(), f"missing from the wheel: {path}"
          templates = list(root.joinpath("generators/django/templates").iterdir())
          assert templates, "generator templates missing from the wheel"
          print("wheel OK:", besser.__file__)
          EOF
      - name: Run the besser command from the wheel
        working-directory: ${{ runner.temp }}
        run: |
          cat > model.py <<'EOF'
          from besser.BUML.metamodel.structural import Class, DomainModel, Property, StringType
          book = Class(name="Book", attributes={Property(name="title", type=StringType)})
          model = DomainModel(name="Library", types={book})
          EOF
          wheel-env/bin/besser --version
          wheel-env/bin/besser validate model.py --strict
          wheel-env/bin/besser generate python model.py -o out
          test -f out/classes.py
          wheel-env/bin/besser new starter.py
          wheel-env/bin/besser validate starter.py model.py --strict
          wheel-env/bin/besser info starter.py
          # model edits on the starter, then one class in full
          wheel-env/bin/besser model -f starter.py add-attribute Book isbn:str?
          wheel-env/bin/besser info starter.py --class Book | grep -F 'isbn:str?'
          # a folder: .py models are skipped (they would be executed) unless --exec-py
          mkdir models && cp model.py starter.py models/
          if wheel-env/bin/besser validate models 2> validate.err; then exit 1; fi
          grep -F -- '--exec-py' validate.err
          wheel-env/bin/besser validate models --exec-py --strict
          wheel-env/bin/besser generate python model.py -o dry --dry-run
          test ! -e dry
          # generate records its output for regenerate without the regen extra
          test -f out/.besser_generated.json
          wheel-env/bin/besser completion bash > besser.bash && bash -n besser.bash
          # mcp needs the mcp extra, and says so on the base install
          if wheel-env/bin/besser mcp < /dev/null 2> mcp.err; then exit 1; fi
          grep -F 'pip install "besser[mcp]"' mcp.err
          # regenerate needs the regen extra, and says so on the base install
          if wheel-env/bin/besser regenerate python starter.py -o app 2> regenerate.err; then exit 1; fi
          grep -F 'pip install "besser[regen]"' regenerate.err
          wheel-env/bin/pip install "$(ls $GITHUB_WORKSPACE/dist/*.whl)[regen]"
          wheel-env/bin/besser regenerate python starter.py -o app
          test -f app/classes.py -a -f app/.besser_generated.json

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install docs dependencies (mirrors the Read the Docs build)
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -r requirements.txt
      - name: Build docs and gate on new warnings
        run: python docs/check_docs.py
